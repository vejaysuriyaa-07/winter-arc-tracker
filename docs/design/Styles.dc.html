<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grove, every season and mood</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1470px; height: 1440px; box-sizing: border-box; padding: 40px; background: #05070C; color: #E8EEF8; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-direction: column; gap: 8px; height: 90px; margin-bottom: 4px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; letter-spacing: 0.12em; line-height: 1">GROVE</div>
<p style="margin: 0; font-size: 16px; color: #8C99B0; max-width: 760px; line-height: 1.5">Each arc picks a season. Your mood each day picks the weather. Rows are seasons, columns are moods.</p>
</header>

<div style="display: flex; gap: 20px; align-items: flex-end; height: 28px">
<div style="width: 120px; flex: none"></div>
<sc-for list="{{moods}}" as="m" hint-placeholder-count="5">
<div style="width: 234px; flex: none; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C99B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg>
<span>{{m.label}}</span>
<span style="font-weight: 400; color: #8C99B0">{{m.weather}}</span>
</div>
</sc-for>
</div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="display: flex; gap: 20px; height: 282px">
<div style="width: 120px; flex: none; display: flex; flex-direction: column; justify-content: center; gap: 8px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1">{{r.name}}</span>
<span style="display: flex; gap: 4px">
<span style="width: 14px; height: 14px; border-radius: 999px; background: {{r.accent}}"></span>
<span style="width: 14px; height: 14px; border-radius: 999px; background: {{r.leaf}}"></span>
<span style="width: 14px; height: 14px; border-radius: 999px; background: {{r.ground}}"></span>
</span>
<span style="font-size: 13px; color: #8C99B0; line-height: 1.4">{{r.desc}}</span>
</div>
<sc-for list="{{r.cells}}" as="cell" hint-placeholder-count="5">
<div style="width: 234px; height: 282px; flex: none; overflow: hidden; border-radius: 16px; border: 1px solid #1B2539">
<div style="width: 390px; height: 470px; overflow: hidden; transform: scale(0.6); transform-origin: 0 0">
<dc-import name="Garden" season="{{cell.season}}" mood="{{cell.mood}}" day="55" start-done="6" arc-name="{{cell.arcName}}" still="1" hint-size="390px,1300px"></dc-import>
</div>
</div>
</sc-for>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1470,"height":1440}}'>
class Component extends DCLogic {
  renderVals() {
    const moods = [
      { key: 'great', label: 'Great', weather: 'sunny', icon: 'M12 7.5A4.5 4.5 0 1 0 12 16.5A4.5 4.5 0 1 0 12 7.5ZM12 2V4M12 20V22M4.9 4.9L6.3 6.3M17.7 17.7L19.1 19.1M2 12H4M20 12H22M4.9 19.1L6.3 17.7M17.7 6.3L19.1 4.9' },
      { key: 'good', label: 'Good', weather: 'clear', icon: 'M8 3V4.5M3.5 7.5H5M4.8 4.3L5.8 5.3M11.2 4.3L10.2 5.3M5.4 10.6A3 3 0 0 1 10.6 7.8M17 20H8A4 4 0 1 1 9.2 12.2A5 5 0 0 1 18.8 13.6A3.2 3.2 0 0 1 17 20Z' },
      { key: 'okay', label: 'Okay', weather: 'cloudy', icon: 'M17.5 19H8A5 5 0 1 1 9.6 9.3A6 6 0 0 1 20.8 12.5A3.5 3.5 0 0 1 17.5 19Z' },
      { key: 'low', label: 'Low', weather: 'rain or snow', icon: 'M17.5 14H8A4.5 4.5 0 1 1 9.5 5.3A5.5 5.5 0 0 1 19.8 8.2A3 3 0 0 1 17.5 14ZM8 17V19M12 18V20M16 17V19' },
      { key: 'rough', label: 'Rough', weather: 'storm', icon: 'M17.5 13H8A4.5 4.5 0 1 1 9.5 4.3A5.5 5.5 0 0 1 19.8 7.2A3 3 0 0 1 17.5 13ZM13 14L10.5 18H14L11.5 22' }
    ];
    const seasons = [
      { key: 'winter', name: 'Winter', arcName: 'Winter Arc', accent: '#22D3EE', leaf: '#1E5F6B', ground: '#E6EEF7', desc: 'Snowy pines, icy cyan' },
      { key: 'spring', name: 'Spring', arcName: 'Spring Arc', accent: '#F472B6', leaf: '#5DAA5A', ground: '#7FBF6A', desc: 'Blossoms, soft pink' },
      { key: 'summer', name: 'Summer', arcName: 'Summer Arc', accent: '#F59E0B', leaf: '#2E7D32', ground: '#8BC34A', desc: 'Lush green, warm amber' },
      { key: 'autumn', name: 'Autumn', arcName: 'Autumn Arc', accent: '#FB923C', leaf: '#E07A2E', ground: '#C49A5A', desc: 'Falling orange, copper' }
    ];
    return {
      moods: moods,
      rows: seasons.map((s) => Object.assign({}, s, {
        cells: moods.map((m) => ({ season: s.key, mood: m.key, arcName: s.arcName }))
      }))
    };
  }
}
</script>
</body>
</html>
