<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grove, progress for this arc</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 1560px; box-sizing: border-box; padding: 20px 16px 104px; background: #070B14; color: #E8EEF8; font-family: Inter, system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.14em; line-height: 1">GROVE</div>
<div style="font-size: 13px; color: #8C99B0">Progress</div>
</div>
<button type="button" aria-label="Switch arc" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 999px; border: 1px solid #1B2539; background: #0D1424; color: #E8EEF8; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer">
<span>Winter Arc</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9L12 15L18 9"></path></svg>
</button>
</header>

<nav aria-label="Progress range" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 14px; background: #0D1424; border: 1px solid #1B2539">
<a href="ProgressArc.dc.html" aria-current="page" style="height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1B2539; color: #E8EEF8; font-size: 14px; font-weight: 600; text-decoration: none">This arc</a>
<a href="ProgressAll.dc.html" style="height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #8C99B0; font-size: 14px; font-weight: 600; text-decoration: none">All time</a>
</nav>

<section aria-label="Garden timelapse" style="display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 302px; border-radius: 24px; overflow: hidden">
<div style="position: absolute; left: -16px; top: -84px; width: 390px; height: 1300px">
<dc-import name="Garden" season="winter" mood="good" day="{{day}}" start-done="0" arc-name="Winter Arc" hint-size="390px,1300px"></dc-import>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="{{playLabel}}" onClick="{{play}}" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: none; background: #22D3EE; color: #04121A; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{playIcon}}"></path></svg>
</button>
<input type="range" min="1" max="40" step="1" value="{{day}}" onChange="{{onScrub}}" aria-label="Scrub through the arc" style="flex: 1; min-width: 0; accent-color: #22D3EE; height: 44px">
<span style="width: 56px; flex: none; text-align: right; font-size: 13px; font-weight: 600; color: #8C99B0">{{dateLabel}}</span>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 16px; border: 1px solid #1B2539; background: #0D1424"><span style="font-size: 12px; color: #8C99B0">Days kept</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">31 <span style="font-size: 18px; color: #8C99B0">of 39</span></span></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 16px; border: 1px solid #1B2539; background: #0D1424"><span style="font-size: 12px; color: #8C99B0">This arc</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">74%</span></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 16px; border: 1px solid #1B2539; background: #0D1424"><span style="font-size: 12px; color: #8C99B0">Streak</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">6 <span style="font-size: 18px; color: #8C99B0">days</span></span></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 16px; border: 1px solid #1B2539; background: #0D1424"><span style="font-size: 12px; color: #8C99B0">Best streak</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">11 <span style="font-size: 18px; color: #8C99B0">days</span></span></div>
</div>

<a href="Calendar.dc.html" style="min-height: 52px; box-sizing: border-box; padding: 0 14px 0 16px; display: flex; align-items: center; gap: 12px; border-radius: 16px; border: 1px solid #1B2539; background: #0D1424; color: #E8EEF8; font-size: 15px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C99B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10H20.5M8 3V7M16 3V7"></path></svg>
<span style="flex: 1">Month view</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C99B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6L15 12L9 18"></path></svg>
</a>

<section aria-label="Your plants" style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 600; color: #8C99B0">Your plants, tallest first</h2>
<sc-for list="{{plants}}" as="p" hint-placeholder-count="9">
<a href="PlantDetail.dc.html" style="min-height: 54px; box-sizing: border-box; padding: 6px 12px 6px 8px; display: flex; align-items: center; gap: 10px; border-radius: 14px; border: 1px solid #1B2539; background: #0D1424; color: #E8EEF8; text-decoration: none">
<span aria-hidden="true" style="width: 40px; height: 40px; flex: none; display: flex; align-items: flex-end; justify-content: center; border-radius: 10px; background: #121B2E; overflow: hidden">
<svg width="24" height="34" viewBox="0 0 24 34" style="transform: scale({{p.scale}}); transform-origin: 50% 100%"><path d="M12 34V22" stroke="#8A6A52" stroke-width="2.4" stroke-linecap="round"></path><path d="M12 1L19 13H5ZM12 6L21 24H3Z" fill="{{p.color}}"></path></svg>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
<span style="display: flex; justify-content: space-between; gap: 8px; font-size: 15px"><span style="font-weight: 500">{{p.name}}</span><span style="color: #8C99B0; font-size: 13px">{{p.days}} of 39 days</span></span>
<span style="height: 4px; border-radius: 999px; background: #1B2539; overflow: hidden"><span style="display: block; width: {{p.pct}}%; height: 100%; border-radius: 999px; background: {{p.bar}}"></span></span>
</span>
</a>
</sc-for>
</section>

<section aria-label="Your week" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; border: 1px solid #1B2539; background: #0D1424">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Your week</h2>
<span style="font-size: 13px; color: #8C99B0">Sundays are your dry spot</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 110px">
<sc-for list="{{week}}" as="w" hint-placeholder-count="7">
<span style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="font-size: 11px; color: #8C99B0">{{w.pct}}</span>
<span style="width: 100%; height: {{w.h}}px; border-radius: 8px 8px 4px 4px; background: {{w.color}}"></span>
<span style="font-size: 12px; font-weight: 600; color: {{w.label}}">{{w.day}}</span>
</span>
</sc-for>
</div>
</section>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 22px; background: #0A101D; border-top: 1px solid #1B2539; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<button type="button" style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: none; color: #8C99B0; font: 600 11px Inter, system-ui, sans-serif; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V11M12 11C12 7 9 5 5 5C5 9 8 11 12 11ZM12 14C12 11 14.5 9 18 9C18 12 15.5 14 12 14ZM6 21H18"></path></svg>
<span>Garden</span>
</button>
<button type="button" aria-current="page" style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: none; color: #22D3EE; font: 600 11px Inter, system-ui, sans-serif; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5.5"></circle><circle cx="12" cy="12" r="2"></circle></svg>
<span>Progress</span>
</button>
<button type="button" style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: none; color: #8C99B0; font: 600 11px Inter, system-ui, sans-serif; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18C6 10 18 10 21 18M7 18C9 14 15 14 17 18"></path></svg>
<span>Arcs</span>
</button>
<button type="button" style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: none; color: #8C99B0; font: 600 11px Inter, system-ui, sans-serif; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7H13M19 7H20M4 17H6M12 17H20"></path><circle cx="16" cy="7" r="2.5"></circle><circle cx="9" cy="17" r="2.5"></circle></svg>
<span>Settings</span>
</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }

  renderVals() {
    const s = this.state || {};
    const day = s.day || 40;
    const playing = !!s.playing;

    const stop = () => {
      if (this.timer) {
        clearInterval(this.timer);
        this.timer = null;
      }
    };
    const play = () => {
      if (this.timer) {
        stop();
        this.setState({ playing: false });
        return;
      }
      const cur = (this.state && this.state.day) || 40;
      let d = cur >= 40 ? 1 : cur;
      this.setState({ day: d, playing: true });
      this.timer = setInterval(() => {
        d += 1;
        if (d >= 40) {
          stop();
          this.setState({ day: 40, playing: false });
        } else {
          this.setState({ day: d });
        }
      }, 120);
    };
    const onScrub = (e) => {
      stop();
      this.setState({ day: parseInt(e.target.value, 10) || 1, playing: false });
    };

    const date = new Date(2026, 8, 17 + day - 1);
    const dateLabel = day === 40 ? 'Today' : date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

    const raw = [
      ['Read', 37], ['Wake up at 5 AM', 35], ['Plan next day', 33], ['Cold shower', 31], ['Meditation', 29],
      ['Eat healthy', 23], ['No social media', 21], ['Journaling', 18], ['Gym', 14]
    ];
    const plants = raw.map((r, i) => {
      const pct = Math.round((r[1] / 39) * 100);
      return {
        name: r[0],
        days: r[1],
        pct: pct,
        scale: (0.45 + (r[1] / 70) * 0.9).toFixed(2),
        color: i % 2 === 0 ? '#2B7A86' : '#1E5F6B',
        bar: pct >= 50 ? '#22D3EE' : 'rgba(34, 211, 238, 0.45)'
      };
    });

    const weekRaw = [['M', 82], ['T', 88], ['W', 79], ['T', 76], ['F', 84], ['S', 71], ['S', 58]];
    const minV = Math.min.apply(null, weekRaw.map((w) => w[1]));
    const week = weekRaw.map((w) => ({
      day: w[0],
      pct: w[1] + '%',
      h: Math.round(w[1] * 0.75),
      color: w[1] === minV ? 'rgba(248, 113, 113, 0.75)' : '#22D3EE',
      label: w[1] === minV ? '#F87171' : '#8C99B0'
    }));

    return {
      day: day,
      play: play,
      playLabel: playing ? 'Pause timelapse' : 'Play timelapse',
      playIcon: playing ? 'M7 5H10V19H7ZM14 5H17V19H14Z' : 'M8 5L19 12L8 19Z',
      onScrub: onScrub,
      dateLabel: dateLabel,
      plants: plants,
      week: week
    };
  }
}
</script>
</body>
</html>
