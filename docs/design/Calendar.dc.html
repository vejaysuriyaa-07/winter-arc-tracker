<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grove, calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 880px; box-sizing: border-box; padding: 20px 16px 104px; background: #070B14; color: #E8EEF8; font-family: Inter, system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.14em; line-height: 1">GROVE</div>
<div style="font-size: 13px; color: #8C99B0">Monday, Oct 26</div>
</div>
<button type="button" aria-label="Switch arc" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 999px; border: 1px solid #1B2539; background: #0D1424; color: #E8EEF8; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer">
<span>Winter Arc</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9L12 15L18 9"></path></svg>
</button>
</header>

<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Previous month" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid #1B2539; background: #0D1424; color: #E8EEF8; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6L9 12L15 18"></path></svg>
</button>
<h1 style="margin: 0; font-size: 18px; font-weight: 600">October 2026</h1>
<button type="button" aria-label="Next month" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid #1B2539; background: #0D1424; color: #E8EEF8; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6L15 12L9 18"></path></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 12px; font-weight: 600; color: #8C99B0; text-align: center">
<span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{cells}}" as="d" hint-placeholder-count="35">
<button type="button" disabled="{{d.off}}" aria-label="{{d.label}}" style="position: relative; height: 46px; box-sizing: border-box; border-radius: 12px; border: {{d.border}}; background: {{d.bg}}; color: {{d.color}}; font: {{d.weight}} 14px Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{d.op}}">
<span>{{d.num}}</span>
<span style="position: absolute; bottom: 6px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 999px; background: {{d.dot}}"></span>
</button>
</sc-for>
</div>
<div style="display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #8C99B0; margin-top: 4px">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #22D3EE"></span>All done</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: rgba(34, 211, 238, 0.5)"></span>Most</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: rgba(34, 211, 238, 0.2)"></span>Some</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 4px; border: 1px dashed rgba(140, 153, 176, 0.7)"></span>Not logged</span>
</div>
</div>

<section aria-label="Last 7 days" style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 20px; border: 1px solid #1B2539; background: #0D1424">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Last 7 days</h2>
<span style="font-size: 13px; color: #8C99B0">Oct 20 to 26</span>
</div>
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 56px; line-height: 0.9">84%</span>
<span style="font-size: 14px; font-weight: 600; color: #22D3EE">+19 vs the week before</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: #121B2E"><span style="font-size: 12px; color: #8C99B0">Full days</span><span style="font-size: 16px; font-weight: 600">3 of 7</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: #121B2E"><span style="font-size: 12px; color: #8C99B0">Weakest day</span><span style="font-size: 16px; font-weight: 600">Sundays</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: #121B2E"><span style="font-size: 12px; color: #8C99B0">Streak</span><span style="font-size: 16px; font-weight: 600">6 days, best 11</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: #121B2E"><span style="font-size: 12px; color: #8C99B0">Arc so far</span><span style="font-size: 16px; font-weight: 600">74%</span></div>
</div>
</section>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 22px; background: #0A101D; border-top: 1px solid #1B2539; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<button type="button" style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: none; color: #8C99B0; font: 600 11px Inter, system-ui, sans-serif; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V11M12 11C12 7 9 5 5 5C5 9 8 11 12 11ZM12 14C12 11 14.5 9 18 9C18 12 15.5 14 12 14ZM6 21H18"></path></svg>
<span>Garden</span>
</button>
<button type="button" style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: none; color: #8C99B0; font: 600 11px Inter, system-ui, sans-serif; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18C6 10 18 10 21 18M7 18C9 14 15 14 17 18"></path></svg>
<span>Arcs</span>
</button>
<button type="button" aria-current="page" style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: none; color: #22D3EE; font: 600 11px Inter, system-ui, sans-serif; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10H20.5M8 3V7M16 3V7"></path></svg>
<span>Calendar</span>
</button>
<button type="button" style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: none; color: #8C99B0; font: 600 11px Inter, system-ui, sans-serif; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7H13M19 7H20M4 17H6M12 17H20"></path><circle cx="16" cy="7" r="2.5"></circle><circle cx="9" cy="17" r="2.5"></circle></svg>
<span>Settings</span>
</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    const hist = [100, 89, 78, 100, 67, 44, 100, 89, 100, 78, 56, 100, 89, null, 78, 100, 100, 89, 0, 100, 89, 78, 100, 100, 67];
    const today = 26;
    const todayPct = 56;
    const lead = 3;
    const cyan = (a) => 'rgba(34, 211, 238, ' + a + ')';
    const style = (v) => {
      if (v === 100) return { bg: '#22D3EE', color: '#04121A', weight: 700 };
      if (v >= 80) return { bg: cyan(0.5), color: '#E8EEF8', weight: 600 };
      if (v >= 50) return { bg: cyan(0.28), color: '#E8EEF8', weight: 500 };
      if (v >= 1) return { bg: cyan(0.14), color: '#E8EEF8', weight: 500 };
      return { bg: 'transparent', color: '#E8EEF8', weight: 500 };
    };
    const cells = [];
    for (let i = 0; i < lead; i++) {
      cells.push({ num: '', label: 'Empty', bg: 'transparent', border: 'none', color: 'transparent', weight: 400, dot: 'transparent', op: 0, off: true });
    }
    for (let day = 1; day <= 31; day++) {
      let cell;
      if (day < today) {
        const v = hist[day - 1];
        if (v === null) {
          cell = { bg: 'transparent', border: '1px dashed rgba(140, 153, 176, 0.7)', color: '#8C99B0', weight: 500, dot: 'transparent', label: 'Oct ' + day + ', not logged' };
        } else {
          const s = style(v);
          cell = { bg: s.bg, border: v === 0 ? '1px solid #1B2539' : 'none', color: s.color, weight: s.weight, dot: v === 0 ? '#F87171' : 'transparent', label: 'Oct ' + day + ', ' + v + '% done' };
        }
      } else if (day === today) {
        const s = style(todayPct);
        cell = { bg: s.bg, border: '2px solid #E8EEF8', color: '#E8EEF8', weight: 700, dot: 'transparent', label: 'Today, ' + todayPct + '% so far' };
      } else {
        cell = { bg: 'rgba(232, 238, 248, 0.04)', border: 'none', color: '#5D6A80', weight: 500, dot: 'transparent', label: 'Oct ' + day };
      }
      cell.num = String(day);
      cell.op = 1;
      cell.off = false;
      cells.push(cell);
    }
    return { cells: cells };
  }
}
</script>
</body>
</html>
